<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSIEI - AI Assistant</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#080b12;
    color:white;
    height:100vh;
    overflow:hidden;
}

/* Animated background */
body:before,
body:after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.25;
    pointer-events:none;
    z-index:-1;
}

body:before{
    background:#5865f2;
    top:-250px;
    left:-200px;
    animation:move1 8s infinite alternate;
}

body:after{
    background:#9b5cff;
    right:-200px;
    bottom:-250px;
    animation:move2 10s infinite alternate;
}

@keyframes move1{
    to{transform:translate(200px,150px)}
}

@keyframes move2{
    to{transform:translate(-150px,-100px)}
}

/* LOGIN */
#loginScreen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#080b12;
    z-index:100;
}

.loginBox{
    width:90%;
    max-width:400px;
    padding:32px;
    border-radius:24px;
    background:#111620ee;
    border:1px solid #ffffff15;
    text-align:center;
    box-shadow:0 20px 70px #0008;
}

.loginLogo{
    font-size:38px;
    font-weight:bold;
    margin-bottom:8px;
}

.loginLogo span,
.logo span{
    color:#7885ff;
}

.loginBox p{
    color:#929aaa;
    margin-bottom:25px;
}

.loginInput{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border-radius:12px;
    border:1px solid #ffffff15;
    outline:none;
    background:#080b12;
    color:white;
}

.loginBtn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    color:white;
    font-weight:bold;
    background:linear-gradient(135deg,#5865f2,#965cff);
    cursor:pointer;
}

/* APP */
#app{
    display:none;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:255px;
    height:100%;
    padding:20px;
    background:#0d111aee;
    border-right:1px solid #ffffff0d;
    z-index:50;
}

.logo{
    font-size:25px;
    font-weight:bold;
    margin-bottom:25px;
}

.newChat{
    width:100%;
    padding:13px;
    border:1px solid #ffffff15;
    border-radius:12px;
    background:#171d29;
    color:white;
    text-align:left;
    cursor:pointer;
    margin-bottom:15px;
}

.menu button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:transparent;
    color:#aeb5c5;
    text-align:left;
    cursor:pointer;
    margin-bottom:3px;
}

.menu button:hover{
    background:#ffffff0b;
    color:white;
}

/* MAIN */
.main{
    margin-left:255px;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:65px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 22px;
    border-bottom:1px solid #ffffff0d;
    background:#080b12aa;
    backdrop-filter:blur(15px);
}

.mobileMenu{
    display:none;
    background:none;
    border:0;
    color:white;
    font-size:22px;
    margin-right:10px;
}

.model{
    background:#151a26;
    padding:9px 14px;
    border-radius:10px;
    font-size:14px;
}

.profile{
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#5865f2,#9b5cff);
    font-weight:bold;
}

/* CHAT */
.chatArea{
    flex:1;
    overflow-y:auto;
    padding:35px 15px 150px;
}

.welcome{
    max-width:850px;
    margin:65px auto 0;
    text-align:center;
}

.welcome h1{
    font-size:45px;
    margin-bottom:12px;
    background:linear-gradient(90deg,#fff,#8d9aff,#d49cff);
    -webkit-background-clip:text;
    color:transparent;
}

.welcome p{
    color:#9098aa;
}

.cards{
    max-width:700px;
    margin:30px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.card{
    padding:20px;
    border-radius:17px;
    border:1px solid #ffffff10;
    background:#111620aa;
    text-align:left;
    cursor:pointer;
}

.card:hover{
    background:#181e2a;
}

.card strong{
    display:block;
    margin-bottom:7px;
}

.card span{
    color:#8f97a8;
    font-size:13px;
}

/* MESSAGES */
.message{
    max-width:850px;
    margin:15px auto;
    padding:16px 18px;
    border-radius:15px;
    line-height:1.6;
}

.userMessage{
    background:#181e2a;
}

.aiMessage{
    background:#10151e;
    border:1px solid #ffffff08;
}

/* COMPOSER */
.composerWrap{
    position:fixed;
    bottom:0;
    left:255px;
    right:0;
    padding:18px;
    background:linear-gradient(transparent,#080b12 30%);
}

.composer{
    max-width:850px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px;
    border:1px solid #ffffff17;
    border-radius:20px;
    background:#111620ee;
    backdrop-filter:blur(18px);
}

#prompt{
    flex:1;
    padding:10px;
    background:transparent;
    border:0;
    outline:none;
    color:white;
    font-size:15px;
}

.iconBtn,
.sendBtn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    cursor:pointer;
}

.iconBtn{
    background:#1b2130;
    color:white;
    font-size:22px;
}

.sendBtn{
    background:linear-gradient(135deg,#5865f2,#965cff);
    color:white;
    font-size:20px;
}

/* MODERN VOICE BUTTON */
.voiceBtn{
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid #ffffff18;
    background:#171d29;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
}

.mic{
    width:13px;
    height:20px;
    border:2px solid #e5e8ff;
    border-radius:10px;
    position:relative;
}

.mic:after{
    content:"";
    position:absolute;
    width:19px;
    height:10px;
    left:50%;
    top:14px;
    transform:translateX(-50%);
    border:2px solid #8793ff;
    border-top:0;
    border-radius:0 0 12px 12px;
}

.mic:before{
    content:"";
    position:absolute;
    width:2px;
    height:7px;
    background:#8793ff;
    left:50%;
    top:23px;
    transform:translateX(-50%);
}

.voiceBtn.listening{
    background:linear-gradient(135deg,#5865f2,#9b5cff);
    box-shadow:0 0 0 7px #5865f233,0 0 30px #5865f288;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    50%{transform:scale(1.08)}
}

/* MOBILE */
@media(max-width:700px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
    }

    .composerWrap{
        left:0;
        padding:10px;
    }

    .mobileMenu{
        display:block;
    }

    .welcome{
        margin-top:40px;
    }

    .welcome h1{
        font-size:34px;
    }

    .cards{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">

    <div class="loginBox">

        <div class="loginLogo">
            KS<span>IEI</span>
        </div>

        <p>Your intelligent AI workspace</p>

        <input id="loginName"
               class="loginInput"
               placeholder="Your name">

        <input class="loginInput"
               type="email"
               placeholder="Email address">

        <input class="loginInput"
               type="password"
               placeholder="Password">

        <button class="loginBtn" onclick="enterKSIEI()">
            Continue to KSIEI
        </button>

    </div>

</div>


<!-- APP -->
<div id="app">

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            KS<span>IEI</span>
        </div>

        <button class="newChat" onclick="goHome()">
            ＋ New Chat
        </button>

        <div class="menu">

            <button onclick="goHome()">⌂ Home</button>

            <button onclick="alert('Search will be connected next')">
                Search
            </button>

            <button onclick="alert('Projects will be connected next')">
                Projects
            </button>

            <button onclick="alert('Website Builder will be connected next')">
                Website Builder
            </button>

            <button onclick="alert('Settings will be connected next')">
                Settings
            </button>

        </div>

    </aside>


    <main class="main">

        <div class="topbar">

            <div style="display:flex;align-items:center">

                <button class="mobileMenu"
                        onclick="toggleSidebar()">
                    ☰
                </button>

                <div class="model">
                    KSIEI AI ▾
                </div>

            </div>

            <div class="profile" id="profile">K</div>

        </div>


        <section class="chatArea" id="chatArea">

        </section>


        <div class="composerWrap">

            <div class="composer">

                <button class="iconBtn"
                        onclick="alert('File upload will be added next')">
                    +
                </button>

                <input id="prompt"
                       placeholder="Message KSIEI...">

                <!-- Modern button - NO emoji -->
                <button class="voiceBtn"
                        id="voiceBtn"
                        onclick="startVoice()">

                    <span class="mic"></span>

                </button>

                <button class="sendBtn"
                        onclick="sendMessage()">
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>


<script>

/* LOGIN */
function enterKSIEI(){

    const name =
        document.getElementById("loginName").value.trim();

    document.getElementById("loginScreen").style.display="none";
    document.getElementById("app").style.display="block";

    if(name){
        document.getElementById("profile").textContent =
            name.charAt(0).toUpperCase();
    }

    goHome();
}


/* HOME + NEW CHAT */
function goHome(){

    const chatArea =
        document.getElementById("chatArea");

    chatArea.innerHTML = `

        <div class="welcome">

            <h1>What can I help you build?</h1>

            <p>
                Ask KSIEI anything, create ideas,
                write code, build websites and more.
            </p>

            <div class="cards">

                <div class="card"
                onclick="usePrompt('Build a modern website for my business')">

                    <strong>Build a website</strong>

                    <span>
                        Create a modern website from an idea.
                    </span>

                </div>


                <div class="card"
                onclick="usePrompt('Give me 10 creative business ideas')">

                    <strong>Brainstorm</strong>

                    <span>
                        Generate useful new ideas.
                    </span>

                </div>


                <div class="card"
                onclick="usePrompt('Write HTML and CSS for a website')">

                    <strong>Write code</strong>

                    <span>
                        Generate and explain code.
                    </span>

                </div>


                <div class="card"
                onclick="usePrompt('Create a business plan')">

                    <strong>Create a plan</strong>

                    <span>
                        Turn an idea into a structured plan.
                    </span>

                </div>

            </div>

        </div>
    `;

    /* IMPORTANT:
       mobile sidebar close */
    document
        .getElementById("sidebar")
        .classList.remove("open");

    chatArea.scrollTop=0;

}


/* QUICK PROMPT */
function usePrompt(text){

    document.getElementById("prompt").value=text;

    document.getElementById("prompt").focus();

}


/* SEND MESSAGE */
function sendMessage(){

    const input =
        document.getElementById("prompt");

    const text =
        input.value.trim();

    if(!text) return;

    const chatArea =
        document.getElementById("chatArea");

    const user =
        document.createElement("div");

    user.className="message userMessage";
    user.textContent=text;

    chatArea.appendChild(user);

    input.value="";

    setTimeout(function(){

        const ai =
            document.createElement("div");

        ai.className="message aiMessage";

        ai.innerHTML=
            "<strong>KSIEI</strong><br><br>" +
            "I'm ready to help. Real AI backend " +
            "will be connected securely in the next stage.";

        chatArea.appendChild(ai);

        chatArea.scrollTop =
            chatArea.scrollHeight;

    },500);

}


/* ENTER KEY */
document
.getElementById("prompt")
.addEventListener("keydown",function(e){

    if(e.key==="Enter"){
        sendMessage();
    }

});


/* SIDEBAR */
function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


/* VOICE */
let recognition=null;
let listening=false;

function startVoice(){

    const button =
        document.getElementById("voiceBtn");

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert("Voice input is not supported in this browser.");
        return;

    }

    if(listening){

        if(recognition){
            recognition.stop();
        }

        return;

    }

    recognition =
        new SpeechRecognition();

    recognition.lang="en-IN";
    recognition.interimResults=true;
    recognition.continuous=false;

    listening=true;

    button.classList.add("listening");

    recognition.onresult=function(event){

        let text="";

        for(
            let i=event.resultIndex;
            i<event.results.length;
            i++
        ){

            text +=
                event.results[i][0].transcript;

        }

        document.getElementById("prompt").value=text;

    };

    recognition.onend=function(){

        listening=false;
        button.classList.remove("listening");

    };

    recognition.onerror=function(){

        listening=false;
        button.classList.remove("listening");

    };

    recognition.start();

}

</script>

</body>
</html>
