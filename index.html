<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KSIEI - AI Assistant</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0b0d12;
  color:#fff;
  height:100vh;
  overflow:hidden;
}

/* =========================
   LOGIN
========================= */

.login{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% 35%,#24145c 0%,#10121b 35%,#050609 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  overflow:hidden;
}

.login-orb{
  position:absolute;
  width:280px;
  height:280px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,
      rgba(255,255,255,.9),
      rgba(124,92,255,.65) 12%,
      rgba(56,189,248,.3) 38%,
      rgba(124,92,255,.08) 65%,
      transparent 72%);
  box-shadow:
    0 0 50px rgba(124,92,255,.55),
    0 0 120px rgba(56,189,248,.25);
  animation:orbFloat 5s ease-in-out infinite;
  filter:blur(.2px);
}

.login-orb::before,
.login-orb::after{
  content:"";
  position:absolute;
  inset:-25px;
  border:1px solid rgba(124,92,255,.35);
  border-radius:50%;
  animation:ringRotate 8s linear infinite;
}

.login-orb::after{
  inset:-45px;
  border-color:rgba(56,189,248,.18);
  animation-duration:12s;
}

@keyframes orbFloat{
  0%,100%{
    transform:translateY(0) scale(1);
  }
  50%{
    transform:translateY(-18px) scale(1.04);
  }
}

@keyframes ringRotate{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

.particle{
  position:absolute;
  width:3px;
  height:3px;
  background:#8b7cff;
  border-radius:50%;
  box-shadow:0 0 12px #8b7cff;
  animation:particleMove 5s linear infinite;
}

.p1{left:12%;top:25%;animation-delay:0s}
.p2{left:85%;top:30%;animation-delay:1s}
.p3{left:20%;top:75%;animation-delay:2s}
.p4{left:78%;top:70%;animation-delay:3s}
.p5{left:50%;top:10%;animation-delay:4s}
.p6{left:50%;top:90%;animation-delay:1.5s}

@keyframes particleMove{
  0%{transform:translateY(0) scale(1);opacity:.2}
  50%{transform:translateY(-35px) scale(1.5);opacity:1}
  100%{transform:translateY(0) scale(1);opacity:.2}
}

.login-box{
  position:relative;
  z-index:10;
  width:90%;
  max-width:420px;
  padding:32px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:25px;
  background:rgba(17,20,27,.78);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  text-align:center;
  box-shadow:
    0 25px 80px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.08);
  animation:loginAppear .8s ease;
}

@keyframes loginAppear{
  from{
    opacity:0;
    transform:translateY(30px) scale(.95);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.login-logo{
  font-size:38px;
  font-weight:800;
  letter-spacing:2px;
  margin-bottom:5px;
}

.login-logo span{
  color:#8b7cff;
}

.login-subtitle{
  color:#a8adbd;
  margin-bottom:25px;
}

.social-login,
.continue-btn{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:13px;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:.25s;
}

.social-login:hover,
.continue-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(124,92,255,.25);
}

.google-login{
  background:#fff;
  color:#222;
}

.apple-login{
  background:#08090d;
}

.phone-login{
  background:#151923;
}

.google-icon,
.apple-icon,
.phone-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-right:8px;
  font-weight:bold;
}

.google-icon{
  color:#4285f4;
}

.apple-icon{
  color:#fff;
}

.phone-icon{
  color:#8b7cff;
}

.login-divider{
  display:flex;
  align-items:center;
  gap:10px;
  color:#666d7d;
  margin:22px 0 10px;
}

.login-divider::before,
.login-divider::after{
  content:"";
  height:1px;
  flex:1;
  background:#292d38;
}

.login-box input{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:1px solid #292d38;
  border-radius:12px;
  outline:none;
  background:#0c0f15;
  color:#fff;
  font-size:15px;
}

.login-box input:focus{
  border-color:#7c5cff;
}

.continue-btn{
  background:#7c5cff;
  border:none;
}

#loginStatus{
  margin-top:15px;
  font-size:13px;
  color:#ff9b9b;
  min-height:18px;
}

/* =========================
   APP
========================= */

.app{
  display:none;
  width:100%;
  height:100vh;
  background:#0b0d12;
}

/* SIDEBAR */

.sidebar{
  width:250px;
  height:100vh;
  background:#10131a;
  border-right:1px solid #252936;
  padding:20px;
  display:flex;
  flex-direction:column;
}

.brand{
  font-size:25px;
  font-weight:800;
  margin-bottom:30px;
}

.brand span{
  color:#7c5cff;
}

.new-chat{
  width:100%;
  padding:13px;
  border:1px solid #343849;
  border-radius:12px;
  background:#171b25;
  color:#fff;
  cursor:pointer;
  margin-bottom:20px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.menu button{
  width:100%;
  padding:13px;
  border:none;
  border-radius:10px;
  background:transparent;
  color:#b7bdcc;
  text-align:left;
  cursor:pointer;
  font-size:15px;
}

.menu button:hover,
.menu button.active{
  background:#1b1f2a;
  color:#fff;
}

.sidebar-bottom{
  margin-top:auto;
}

.logout-btn{
  width:100%;
  padding:12px;
  border:1px solid #303541;
  border-radius:10px;
  background:#151820;
  color:#fff;
  cursor:pointer;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid #252936;
  background:#0d1016;
}

.topbar-title{
  font-weight:bold;
}

.topbar-actions{
  display:flex;
  gap:10px;
}

.topbar-actions button{
  border:1px solid #303541;
  background:#151820;
  color:#fff;
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer;
}

.content{
  flex:1;
  overflow:auto;
  position:relative;
}

/* HOME */

.home{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  text-align:center;
}

.home-inner{
  width:100%;
  max-width:850px;
}

.home-orb{
  width:100px;
  height:100px;
  margin:0 auto 25px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#fff,#7c5cff 22%,#26145e 60%,#0c0d13 75%);
  box-shadow:
    0 0 45px rgba(124,92,255,.6),
    0 0 100px rgba(56,189,248,.2);
  animation:orbFloat 4s ease-in-out infinite;
}

.home h1{
  font-size:44px;
  margin-bottom:12px;
}

.home p{
  color:#999faf;
  font-size:17px;
}

/* CHAT */

.chat{
  height:100%;
  overflow-y:auto;
  padding:25px;
  padding-bottom:130px;
}

.message{
  max-width:850px;
  margin:0 auto 18px;
  padding:15px 17px;
  border-radius:15px;
  line-height:1.6;
  word-wrap:break-word;
}

.message.user{
  background:#1c202b;
}

.message.ai{
  background:#121620;
  border:1px solid #242936;
}

.message.ai strong{
  color:#8b7cff;
}

/* COMPOSER */

.composer{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:15px 20px 20px;
  background:linear-gradient(transparent,#0b0d12 25%);
}

.composer-inner{
  max-width:850px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:8px;
  background:#151923;
  border:1px solid #303541;
  border-radius:18px;
  padding:8px;
}

.composer textarea{
  flex:1;
  min-height:46px;
  max-height:120px;
  resize:none;
  border:none;
  outline:none;
  background:transparent;
  color:#fff;
  padding:12px;
  font-size:15px;
}

.icon-btn{
  width:43px;
  height:43px;
  border:none;
  border-radius:50%;
  background:#242936;
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
}

.send-btn{
  background:#7c5cff;
}

.voice-btn{
  position:relative;
}

.voice-btn.listening{
  background:#ef4444;
  animation:voicePulse 1s infinite;
}

@keyframes voicePulse{
  0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}
  70%{box-shadow:0 0 0 15px rgba(239,68,68,0)}
  100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}
}

/* GENERIC SCREENS */

.page{
  padding:30px;
}

.page h2{
  margin-bottom:10px;
}

.page p{
  color:#969cab;
  margin-bottom:25px;
}

.card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.card{
  padding:22px;
  border:1px solid #292e3a;
  border-radius:17px;
  background:#12151d;
}

.card h3{
  margin-bottom:8px;
}

.card p{
  margin:0;
  color:#8f95a4;
}

/* MOBILE */

@media(max-width:750px){

  .sidebar{
    width:72px;
    padding:12px 8px;
  }

  .brand{
    font-size:18px;
    text-align:center;
  }

  .new-chat{
    font-size:0;
  }

  .new-chat::after{
    content:"+";
    font-size:20px;
  }

  .menu button{
    text-align:center;
    font-size:0;
  }

  .menu button::first-letter{
    font-size:18px;
  }

  .sidebar-bottom{
    display:none;
  }

  .home h1{
    font-size:32px;
  }

  .topbar{
    padding:0 12px;
  }

  .chat{
    padding:15px;
  }

  .composer{
    padding:10px;
  }

  .composer-inner{
    border-radius:15px;
  }

  .login-box{
    padding:25px 20px;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN SCREEN
========================= -->

<div class="login" id="loginScreen">

  <div class="login-orb"></div>

  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>
  <div class="particle p6"></div>

  <div class="login-box">

    <div class="login-logo">
      KS<span>IEI</span>
    </div>

    <p class="login-subtitle">
      Your AI Assistant
    </p>

    <button
      class="social-login google-login"
      onclick="loginWithGoogle()">
      <span class="google-icon">G</span>
      Continue with Google
    </button>

    <button
      class="social-login apple-login"
      onclick="loginWithApple()">
      <span class="apple-icon">●</span>
      Continue with Apple
    </button>

    <button
      class="social-login phone-login"
      onclick="showPhoneLogin()">
      <span class="phone-icon">+</span>
      Continue with Phone
    </button>

    <div class="login-divider">
      <span>OR</span>
    </div>

    <input
      type="text"
      id="username"
      placeholder="Enter your name">

    <input
      type="email"
      id="email"
      placeholder="Email">

    <button
      class="continue-btn"
      onclick="enterKSIEI()">
      Continue with Email
    </button>

    <div id="phoneLoginBox" style="display:none;">

      <input
        type="tel"
        id="phoneNumber"
        placeholder="+91XXXXXXXXXX">

      <button
        class="continue-btn"
        onclick="sendPhoneOTP()">
        Send OTP
      </button>

      <input
        type="text"
        id="otpCode"
        placeholder="Enter OTP"
        style="display:none;">

      <button
        class="continue-btn"
        id="verifyOtpBtn"
        onclick="verifyPhoneOTP()"
        style="display:none;">
        Verify OTP
      </button>

    </div>

    <div id="loginStatus"></div>

  </div>
</div>


<!-- =========================
     MAIN APP
========================= -->

<div class="app" id="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      KS<span>IEI</span>
    </div>

    <button
      class="new-chat"
      onclick="startNewChat()">
      + New Chat
    </button>

    <div class="menu">

      <button
        class="active"
        onclick="renderScreen('home')">
        🏠 Home
      </button>

      <button onclick="renderScreen('chat')">
        💬 Chat
      </button>

      <button onclick="renderScreen('history')">
        🕘 History
      </button>

      <button onclick="renderScreen('projects')">
        📁 Projects
      </button>

      <button onclick="renderScreen('builder')">
        🛠️ Website Builder
      </button>

      <button onclick="renderScreen('files')">
        📎 Files
      </button>

      <button onclick="renderScreen('settings')">
        ⚙️ Settings
      </button>

    </div>

    <div class="sidebar-bottom">

      <button
        class="logout-btn"
        onclick="logoutKSIEI()">
        Log Out
      </button>

    </div>

  </aside>


  <main class="main">

    <div class="topbar">

      <div class="topbar-title" id="pageTitle">
        KSIEI
      </div>

      <div class="topbar-actions">

        <button onclick="toggleTheme()">
          ◐
        </button>

      </div>

    </div>

    <section
      class="content"
      id="content">
    </section>

  </main>

</div>


<!-- =========================
     APP JAVASCRIPT
========================= -->

<script>

let currentScreen = "home";


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(text){

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* =========================
   LOGIN
========================= */

function enterKSIEI(){

  const name =
    document.getElementById("username").value.trim();

  const email =
    document.getElementById("email").value.trim();

  if(!name){

    showLoginStatus("Please enter your name.");

    return;
  }

  if(!email){

    showLoginStatus("Please enter your email.");

    return;
  }

  localStorage.setItem(
    "ksieiGuestName",
    name
  );

  localStorage.setItem(
    "ksieiGuestEmail",
    email
  );

  openKSIEI();

}


function showLoginStatus(message){

  const box =
    document.getElementById("loginStatus");

  if(box){

    box.innerText = message;

  }

}


function openKSIEI(){

  const login =
    document.getElementById("loginScreen");

  const app =
    document.getElementById("app");

  if(login) login.style.display = "none";

  if(app) app.style.display = "flex";

  renderScreen("home");

}


/* =========================
   APP SCREENS
========================= */

function renderScreen(screen){

  currentScreen = screen;

  const content =
    document.getElementById("content");

  const title =
    document.getElementById("pageTitle");

  if(!content) return;


  if(screen === "home"){

    title.innerText = "KSIEI";

    content.innerHTML = `

      <div class="home">

        <div class="home-inner">

          <div class="home-orb"></div>

          <h1>
            Welcome to KSIEI
          </h1>

          <p>
            Your intelligent AI assistant.
            Ask questions, create ideas,
            build websites and more.
          </p>

        </div>

      </div>

    `;

    return;
  }


  if(screen === "chat"){

    title.innerText = "AI Chat";

    content.innerHTML = `

      <div class="chat" id="chatArea">

        <div class="message ai">

          <strong>KSIEI AI</strong>
          <br><br>

          Hello! 👋
          <br><br>

          I am KSIEI, your AI assistant.
          Ask me anything.

        </div>

      </div>

      <div class="composer">

        <div class="composer-inner">

          <button
            class="icon-btn"
            onclick="document.getElementById('fileInput').click()">
            📎
          </button>

          <input
            type="file"
            id="fileInput"
            style="display:none"
            onchange="handleFile(this)">

          <textarea
            id="prompt"
            placeholder="Message KSIEI..."
            onkeydown="handleEnter(event)">
          </textarea>

          <button
            class="icon-btn voice-btn"
            id="voiceButton"
            onclick="startVoiceInput()">
            🎤
          </button>

          <button
            class="icon-btn send-btn"
            onclick="sendMessage()">
            ➤
          </button>

        </div>

      </div>

    `;

    return;
  }


  if(screen === "history"){

    title.innerText = "Chat History";

    content.innerHTML = `

      <div class="page">

        <h2>Chat History</h2>

        <p>
          Your previous conversations will appear here.
        </p>

        <div class="card-grid">

          <div class="card">
            <h3>Recent Chats</h3>
            <p>
              Start a chat to create history.
            </p>
          </div>

        </div>

      </div>

    `;

    return;
  }


  if(screen === "projects"){

    title.innerText = "Projects";

    content.innerHTML = `

      <div class="page">

        <h2>Projects</h2>

        <p>
          Create and manage your AI projects.
        </p>

        <div class="card-grid">

          <div class="card">
            <h3>+ New Project</h3>
            <p>
              Start a new project with KSIEI.
            </p>
          </div>

        </div>

      </div>

    `;

    return;
  }


  if(screen === "builder"){

    title.innerText = "Website Builder";

    content.innerHTML = `

      <div class="page">

        <h2>Website Builder</h2>

        <p>
          Describe the website you want to build.
        </p>

        <div class="card">

          <textarea
            id="builderPrompt"
            placeholder="Example: Create a modern ecommerce website..."
            style="
              width:100%;
              min-height:180px;
              background:#0c0f15;
              color:#fff;
              border:1px solid #303541;
              border-radius:12px;
              padding:15px;
              outline:none;
            ">
          </textarea>

          <button
            class="continue-btn"
            onclick="buildWebsite()">
            Build Website
          </button>

        </div>

      </div>

    `;

    return;
  }


  if(screen === "files"){

    title.innerText = "Files";

    content.innerHTML = `

      <div class="page">

        <h2>Files</h2>

        <p>
          Upload files and use them with KSIEI.
        </p>

        <div class="card">

          <input
            type="file"
            multiple
            onchange="showUploadedFiles(this)"
            style="width:100%;">

          <div
            id="uploadedFiles"
            style="margin-top:20px;">
          </div>

        </div>

      </div>

    `;

    return;
  }


  if(screen === "settings"){

    title.innerText = "Settings";

    content.innerHTML = `

      <div class="page">

        <h2>Settings</h2>

        <p>
          Manage your KSIEI preferences.
        </p>

        <div class="card">

          <h3>Account</h3>

          <p>
            KSIEI AI Assistant
          </p>

        </div>

      </div>

    `;

    return;
  }

}


/* =========================
   NEW CHAT
========================= */

function startNewChat(){

  renderScreen("chat");

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  const input =
    document.getElementById("prompt");

  const chat =
    document.getElementById("chatArea");

  if(!input || !chat){

    return;
  }

  const message =
    input.value.trim();

  if(!message){

    return;
  }


  chat.innerHTML += `

    <div class="message user">

      ${escapeHTML(message)}

    </div>

  `;


  input.value = "";


  const aiId =
    "ai-" + Date.now();


  chat.innerHTML += `

    <div
      class="message ai"
      id="${aiId}">

      <strong>KSIEI AI</strong>
      <br><br>

      KSIEI is thinking...

    </div>

  `;


  chat.scrollTop =
    chat.scrollHeight;


  try{

    const response =
      await fetch(
        "https://ksiei-ai-backend.onrender.com/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            message:message
          })
        }
      );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const data =
      await response.json();


    const reply =
      data.reply ||
      data.error ||
      "Sorry, I could not get a response.";


    const aiReply =
      document.getElementById(aiId);


    if(aiReply){

      aiReply.innerHTML = `

        <strong>KSIEI AI</strong>
        <br><br>

        ${escapeHTML(reply)}

      `;

    }

  }catch(error){

    console.error(
      "KSIEI AI Error:",
      error
    );


    const aiReply =
      document.getElementById(aiId);


    if(aiReply){

      aiReply.innerHTML = `

        <strong>KSIEI AI</strong>
        <br><br>

        KSIEI could not connect to the AI server.
        <br><br>

        Please try again.

      `;

    }

  }


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   ENTER TO SEND
========================= */

function handleEnter(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


/* =========================
   VOICE INPUT
========================= */

let recognition = null;

function startVoiceInput(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Voice input is not supported in this browser."
    );

    return;
  }


  if(recognition){

    recognition.stop();

    recognition = null;

    return;
  }


  recognition =
    new SpeechRecognition();

  recognition.lang = "en-IN";

  recognition.interimResults = true;

  recognition.continuous = false;


  const button =
    document.getElementById("voiceButton");

  const input =
    document.getElementById("prompt");


  if(button){

    button.classList.add("listening");

  }


  recognition.onresult =
    function(event){

      let transcript = "";

      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        transcript +=
          event.results[i][0].transcript;

      }


      if(input){

        input.value =
          transcript;

      }

    };


  recognition.onend =
    function(){

      if(button){

        button.classList.remove(
          "listening"
        );

      }

      recognition = null;

    };


  recognition.onerror =
    function(error){

      console.error(
        "Voice Error:",
        error
      );

      if(button){

        button.classList.remove(
          "listening"
        );

      }

      recognition = null;

    };


  recognition.start();

}


/* =========================
   FILE UPLOAD
========================= */

function handleFile(input){

  if(!input.files.length){

    return;
  }


  const file =
    input.files[0];


  const prompt =
    document.getElementById("prompt");


  if(prompt){

    prompt.value +=
      `[File selected: ${file.name}] `;

  }

}


function showUploadedFiles(input){

  const box =
    document.getElementById(
      "uploadedFiles"
    );


  if(!box) return;


  box.innerHTML = "";


  for(
    const file of input.files
  ){

    box.innerHTML += `

      <div
        style="
          padding:10px;
          border-bottom:1px solid #292e3a;
        ">

        📄
        ${escapeHTML(file.name)}

      </div>

    `;

  }

}


/* =========================

========================= */

function buildWebsite(){

  const input =
    document.getElementById(
      "builderPrompt"
    );


  if(!input) return;


  const text =
    input.value.trim();


  if(!text){

    alert(
      "Please describe the website first."
    );

    return;
  }


  alert(
    "Website Builder request received. AI generation will be connected next."
  );

}


/* =========================
   THEME
========================= */

function toggleTheme(){

  const current =
    document.body.dataset.theme;


  if(current === "light"){

    document.body.dataset.theme =
      "dark";

    document.body.style.background =
      "#0b0d12";

    document.body.style.color =
      "#fff";

  }else{

    document.body.dataset.theme =
      "light";

    document.body.style.background =
      "#f5f7fb";

    document.body.style.color =
      "#111";

    alert(
      "Light mode preview enabled."
    );

  }

}
