<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KSIEI - AI Assistant</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0b0d12;
  color:#fff;
  height:100vh;
  overflow:hidden;
}

/* LOGIN */
.login{
  position:fixed;
  inset:0;
  background:#0b0d12;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

.login-box{
  width:90%;
  max-width:420px;
  padding:35px;
  border:1px solid #292d38;
  border-radius:25px;
  background:#11141b;
  text-align:center;
}

.login-logo{
  font-size:42px;
  font-weight:800;
  margin-bottom:10px;
}

.login-logo span{
  color:#7c5cff;
}

.login-box p{
  color:#9ca3af;
  margin-bottom:25px;
}

.login-box input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:12px;
  border:1px solid #303541;
  background:#181c25;
  color:white;
  outline:none;
}

.login-box button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  background:#7c5cff;
  color:white;
  font-size:16px;
  font-weight:bold;
}

/* APP */
.app{
  display:none;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  height:100vh;
  background:#10131a;
  border-right:1px solid #252936;
  padding:20px;
  position:fixed;
  left:0;
  top:0;
  z-index:100;
  transition:.3s;
}

.logo{
  font-size:27px;
  font-weight:800;
  margin-bottom:25px;
}

.logo span{
  color:#7c5cff;
}

.newChat{
  width:100%;
  padding:13px;
  border:1px solid #303541;
  background:#181c25;
  color:white;
  border-radius:12px;
  font-size:15px;
  cursor:pointer;
  margin-bottom:20px;
}

.newChat:hover{
  background:#222734;
}

.menu button{
  width:100%;
  text-align:left;
  padding:13px;
  margin:4px 0;
  border:0;
  background:transparent;
  color:#c7cad3;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

.menu button:hover{
  background:#1c202a;
  color:white;
}

.menu button.active{
  background:#252034;
  color:#a895ff;
}

/* MAIN */
.main{
  margin-left:260px;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* TOPBAR */
.topbar{
  height:65px;
  border-bottom:1px solid #252936;
  display:flex;
  align-items:center;
  padding:0 20px;
  gap:15px;
  background:#0e1016;
}

.mobile-menu{
  display:none;
  background:none;
  border:0;
  color:white;
  font-size:25px;
}

.back-btn{
  border:1px solid #303541;
  background:#181c25;
  color:white;
  padding:9px 13px;
  border-radius:10px;
  cursor:pointer;
}

.screen-title{
  font-size:18px;
  font-weight:600;
}

.model{
  margin-left:auto;
  padding:9px 13px;
  border-radius:10px;
  background:#181c25;
  border:1px solid #303541;
  color:white;
}

/* CONTENT */
.content{
  flex:1;
  overflow-y:auto;
  position:relative;
}

/* HOME */
.home{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px;
  text-align:center;
}

.home h1{
  font-size:45px;
  margin-bottom:12px;
}

.gradient{
  background:linear-gradient(90deg,#8b6cff,#5ce1e6);
  -webkit-background-clip:text;
  color:transparent;
}

.home p{
  color:#9ca3af;
  font-size:17px;
  margin-bottom:35px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  max-width:650px;
  width:100%;
}

.card{
  padding:20px;
  border:1px solid #292d38;
  background:#11141b;
  border-radius:18px;
  text-align:left;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#6750d9;
}

.card h3{
  margin-bottom:7px;
}

.card p{
  color:#858b98;
  font-size:14px;
}

/* CHAT */
.chat{
  min-height:100%;
  padding:30px;
  padding-bottom:120px;
}

.message{
  max-width:800px;
  margin:15px auto;
  padding:16px 18px;
  border-radius:16px;
  line-height:1.6;
}

.user{
  background:#252936;
}

.ai{
  background:#151922;
  border:1px solid #272c37;
}

/* COMPOSER */
.composer-wrap{
  position:absolute;
  bottom:20px;
  left:30px;
  right:30px;
}

.composer{
  max-width:850px;
  margin:auto;
  background:#151922;
  border:1px solid #303541;
  border-radius:20px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:8px;
}

.composer input{
  flex:1;
  background:transparent;
  border:0;
  outline:0;
  color:white;
  padding:12px;
  font-size:15px;
}

.send-btn,
.voice-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:0;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.send-btn{
  background:#7c5cff;
  color:white;
  font-size:18px;
}

.voice-btn{
  background:#242936;
  border:1px solid #383e4d;
  position:relative;
}

.mic{
  width:10px;
  height:17px;
  border:2px solid white;
  border-radius:8px;
  position:relative;
}

.mic:after{
  content:"";
  position:absolute;
  width:15px;
  height:9px;
  border:2px solid white;
  border-top:0;
  border-radius:0 0 10px 10px;
  left:50%;
  top:12px;
  transform:translateX(-50%);
}

.voice-btn.listening{
  background:#7c5cff;
  box-shadow:0 0 0 7px rgba(124,92,255,.15);
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.08);
  }
}

/* OTHER SCREENS */
.page{
  padding:35px;
  max-width:1000px;
  margin:auto;
}

.page h1{
  font-size:32px;
  margin-bottom:10px;
}

.page-subtitle{
  color:#9298a6;
  margin-bottom:30px;
}

.panel{
  background:#11141b;
  border:1px solid #292d38;
  border-radius:18px;
  padding:22px;
  margin-bottom:15px;
}

.panel h3{
  margin-bottom:8px;
}

.panel p{
  color:#8f95a3;
  line-height:1.6;
}

.search-box{
  width:100%;
  padding:15px;
  background:#151922;
  color:white;
  border:1px solid #303541;
  border-radius:12px;
  outline:none;
  margin-bottom:20px;
}

.builder-input{
  width:100%;
  min-height:150px;
  background:#151922;
  color:white;
  border:1px solid #303541;
  border-radius:12px;
  padding:15px;
  resize:vertical;
  outline:none;
}

.primary{
  margin-top:15px;
  padding:12px 18px;
  border:0;
  border-radius:10px;
  background:#7c5cff;
  color:white;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:800px){

  .sidebar{
    transform:translateX(-100%);
    width:270px;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{

  }

  .mobile-menu{

  }

  .home h1{

  }

  .cards{

  }

  .chat{

  }

  .composer-wrap{
    left:12px;
    right:12px;
    bottom:12px;
  }

  .page{
    padding:22px;
  }
}
</style>

<script>

/* =========================
   NAVIGATION
========================= */

let currentScreen = "home";


function enterKSIEI(){

  const name =
    document.getElementById("username").value.trim();

  if(!name){
    alert("Please enter your name.");
    return;
  }

  localStorage.setItem("ksieiUser", name);

  document.getElementById("loginScreen").style.display="none";
  document.getElementById("app").style.display="flex";

  history.replaceState(
    {screen:"home"},
    "",
    "#home"
  );

  renderScreen("home");
}


function openScreen(screen){

  closeSidebar();

  if(screen === currentScreen){
    return;
  }

  history.pushState(
    {screen:screen},
    "",
    "#" + screen
  );

  renderScreen(screen);
}


function goBack(){

  if(history.length > 1){
    history.back();
  }
}


window.addEventListener("popstate", function(event){

  const screen =
    event.state && event.state.screen
      ? event.state.screen
      : "home";

  renderScreen(screen);

});


function newChat(){

  closeSidebar();

  history.pushState(
    {screen:"chat"},
    "",
    "#chat"
  );

  renderScreen("chat");
}


/* =========================
   SCREEN RENDER
========================= */

function renderScreen(screen){

  currentScreen = screen;

  const content =
    document.getElementById("content");

  const backButton =
    document.getElementById("backButton");

  const title =
    document.getElementById("screenTitle");


  if(screen === "home"){

    title.innerText = "KSIEI";

    backButton.style.display = "none";

    content.innerHTML = `

      <div class="home">

        <h1>
          Hello, <span class="gradient">
          ${escapeHTML(
            localStorage.getItem("ksieiUser") || "there"
          )}
          </span>
        </h1>

        <p>
          What can I help you with today?
        </p>

        <div class="cards">

          <div class="card"
               onclick="newChat()">

            <h3>💬 New Chat</h3>

            <p>
              Start a fresh conversation
              with KSIEI AI.
            </p>

          </div>

          <div class="card"
               onclick="openScreen('search')">

            <h3>Search</h3>

            <p>
              Search and explore information.
            </p>

          </div>

          <div class="card"
               onclick="openScreen('projects')">

            <h3>Projects</h3>

            <p>
              Manage your AI projects.
            </p>

          </div>

          <div class="card"
               onclick="openScreen('builder')">

            <h3>Website Builder</h3>

            <p>
              Create websites using AI.
            </p>

          </div>

        </div>

      </div>

    `;

    return;
  }


  if(screen === "chat"){

    title.innerText = "New Chat";

    backButton.style.display = "block";

    content.innerHTML = `

      <div class="chat" id="chatArea">

        <div class="message ai">

          <strong>KSIEI AI</strong>
          <br><br>

          New conversation started.
          How can I help you?

        </div>

      </div>

      <div class="composer-wrap">

        <div class="composer">

          <input
            id="prompt"
            type="text"
            placeholder="Message KSIEI..."
            onkeydown="handleEnter(event)"
          >

          <button
            class="voice-btn"
            id="voiceBtn"
            onclick="startVoice()">

            <span class="mic"></span>

          </button>

          <button
            class="send-btn"
            onclick="sendMessage()">

            ↑

          </button>

        </div>

      </div>

    `;

    return;
  }


  if(screen === "search"){

    title.innerText = "Search";

    backButton.style.display = "block";

    content.innerHTML = `

      <div class="page">

        <h1>Search</h1>

        <p class="page-subtitle">
          Search information with KSIEI.
        </p>

        <input
          class="search-box"
          id="searchInput"
          placeholder="Search anything..."
          onkeydown="searchEnter(event)"
        >

        <div
          class="panel"
          id="searchResult">

          <h3>Start searching</h3>

          <p>
            Enter something above to begin.
          </p>

        </div>

      </div>

    `;

    return;
  }


  if(screen === "projects"){

    title.innerText = "Projects";

    backButton.style.display = "block";

    content.innerHTML = `

      <div class="page">

        <h1>Projects</h1>

        <p class="page-subtitle">
          Your KSIEI projects will appear here.
        </p>

        <div class="panel">

          <h3>＋ Create Project</h3>

          <p>
            Create and manage your AI projects
            from one place.
          </p>

          <button
            class="primary"
            onclick="alert('Project system will be connected to the backend next.')">

            Create Project

          </button>

        </div>

      </div>

    `;

    return;
  }


  if(screen === "builder"){

    title.innerText = "Website Builder";

    backButton.style.display = "block";

    content.innerHTML = `

      <div class="page">

        <h1>Website Builder</h1>

        <p class="page-subtitle">
          Describe the website you want to create.
        </p>

        <div class="panel">

          <textarea
            class="builder-input"
            id="websiteIdea"
            placeholder="Example: Create a modern ecommerce website for fashion products..."
          ></textarea>

          <button
            class="primary"
            onclick="generateWebsite()">

            Generate Website

        </div>

        <div
          class="panel"
          id="builderResult">

          <h3>AI Website Builder</h3>

          <p>
            Your generated website preview
            will appear here.

        <p class="page-subtitle">
          Manage your KSIEI preferences.

          </p>

  }

}


/* =========================
   CHAT
========================= */

function sendMessage(){

  const input =
    document.getElementById("prompt");

  if(!input){
    return;
  }

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  const chat =
    document.getElementById("chatArea");

  chat.innerHTML += `

    <div class="message user">
      ${escapeHTML(text)}
    </div>

    <div class="message ai">

      <strong>KSIEI AI</strong>
      <br><br>
async function sendMessage(){

  const input = document.getElementById("prompt");
  const chat = document.getElementById("chat");

  const message = input.value.trim();

  if(!message) return;

  chat.innerHTML += `
    <div class="message user">
      ${message}
    </div>
  `;

  input.value = "";

  chat.innerHTML += `
    <div class="message assistant" id="aiReply">
      KSIEI is thinking...
    </div>
  `;

  chat.scrollTop = chat.scrollHeight;

  try {

    const response = await fetch(
      "https://ksiei-ai-backend.onrender.com/chat",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message
        })
      }
    );

    const data = await response.json();

    document.getElementById("aiReply").innerText =
      data.reply || "Sorry, I could not get a response.";

  } catch(error) {

    document.getElementById("aiReply").innerText =
      "KSIEI could not connect to the AI server.";

    console.error(error);
  }

  chat.scrollTop = chat.scrollHeight;
}
      

}


/* =========================
   SEARCH
========================= */

function searchEnter(event){

  if(event.key !== "Enter"){
    return;
  }

  const input =
    document.getElementById("searchInput");

  const result =
    document.getElementById("searchResult");

  const value =
    input.value.trim();

  if(!value){
    result.innerHTML = `
      <h3>Start searching</h3>
      <p>Enter something above to begin.</p>
    `;
    return;
  }

  result.innerHTML = `

    <h3>Search request</h3>

    <p>
      KSIEI received:
      <strong>${escapeHTML(value)}</strong>
    </p>

    <p style="margin-top:10px;">
      Real search will be connected
      with the backend later.
    </p>

  `;
}


/* =========================
   WEBSITE BUILDER
========================= */

function generateWebsite(){

    document.getElementById("websiteIdea").value.trim();

  const result =
    document.getElementById("builderResult");

  if(!idea){
    alert("Please describe your website.");
    return;
  }

  result.innerHTML = `

    <h3>Website request created</h3>

    <p>
      ${escapeHTML(idea)}
    </p>

    <p style="margin-top:12px;">
      AI website generation will be
      connected to the real backend next.
    </p>

  `;
}


/* =========================
   SIDEBAR
========================= */

function toggleSidebar(){

  document
    .getElementById("sidebar")
    .classList.toggle("open");

}


function closeSidebar(){

  document
    .getElementById("sidebar")
    .classList.remove("open");

}


/* =========================
   VOICE INPUT
========================= */

let recognition = null;
let listening = false;


function startVoice(){

  const button =
    document.getElementById("voiceBtn");

  const input =
    document.getElementById("prompt");

  if(!button || !input){
    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Voice input is not supported in this browser."
    );

    return;
  }


  if(listening){

    if(recognition){
      recognition.stop();
    }

    return;
  }


  recognition =
    new SpeechRecognition();

  recognition.lang = "en-IN";

  recognition.interimResults = true;

  recognition.continuous = false;

  listening = true;

  button.classList.add("listening");


  recognition.onresult =
    function(event){

      let text = "";

      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        text +=
          event.results[i][0].transcript;

      }

      input.value = text;

    };


  recognition.onend =
    function(){

      listening = false;

      button.classList.remove(
        "listening"
      );

    };


  recognition.onerror =
    function(){

      listening = false;

      button.classList.remove(
        "listening"
      );

    };


  recognition.start();

}


/* =========================
   SECURITY HELPER
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START APP
========================= */

window.addEventListener(
  "load",
  function(){

    const savedUser =
      localStorage.getItem("ksieiUser");

    if(savedUser){

      document.getElementById(
        "loginScreen"
      ).style.display="none";

      document.getElementById(
        "app"
      ).style.display="flex";

      const hash =
        location.hash.replace("#","");

      const validScreens = [
        "home",
        "chat",
        "search",
        "projects",
        "builder",
        "settings"
      ];

      const startScreen =
        validScreens.includes(hash)
          ? hash
          : "home";

      history.replaceState(
        {screen:startScreen},
        "",
        "#" + startScreen
      );

      renderScreen(startScreen);

    }

  }
);

</script>
